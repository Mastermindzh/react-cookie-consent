name: size
on: [pull_request]
jobs:
  size:
    runs-on: ubuntu-latest
    env:
      CI_JOB_NUMBER: 1
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: andresz1/size-limit-action@f7a56ece616db5bddde81de219695c920a8ae137 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
